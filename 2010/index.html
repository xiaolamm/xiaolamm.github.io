<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gửi Em Yêu 🌼</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Great+Vibes&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0b00;
      font-family: 'Cormorant Garamond', serif
    }

    /* ══ OPENING SCREEN ══ */
    #opening {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 75%, #1c1500 0%, #0d0b00 70%);
      z-index: 100;
    }

    .op-label {
      color: rgba(220, 185, 80, .5);
      font-size: .75rem;
      letter-spacing: .5rem;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .op-rose-icon {
      font-size: 4rem;
      margin-bottom: 24px;
      animation: opRose 3s ease-in-out infinite;
      filter: drop-shadow(0 0 24px rgba(255, 210, 50, .55));
    }

    @keyframes opRose {

      0%,
      100% {
        transform: translateY(0) scale(1)
      }

      50% {
        transform: translateY(-10px) scale(1.06)
      }
    }

    .op-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.2rem, 6vw, 4rem);
      color: #e8c96a;
      text-shadow: 0 0 40px rgba(255, 200, 50, .45);
      margin-bottom: 32px;
      text-align: center;
      padding: 0 20px;
    }

    #openBtn {
      background: none;
      border: 1px solid rgba(200, 160, 40, .5);
      color: rgba(230, 195, 90, .85);
      padding: 12px 36px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      letter-spacing: .25rem;
      cursor: pointer;
      border-radius: 2px;
      transition: all .4s;
      position: relative;
      overflow: hidden;
    }

    #openBtn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(180, 140, 20, .12);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .4s;
    }

    #openBtn:hover::before {
      transform: scaleX(1)
    }

    #openBtn:hover {
      color: #ffe680;
      border-color: rgba(220, 180, 60, .85);
      box-shadow: 0 0 24px rgba(200, 160, 30, .35)
    }

    /* ═══════════ SCENE ═══════════ */
    #scene {
      position: fixed;
      inset: 0;
      display: none
    }

    /* canvas layers */
    #bgCvs,
    #roseCvs,
    #particleCvs {
      position: absolute;
      inset: 0
    }

    #particleCvs {
      pointer-events: none;
      z-index: 3
    }

    /* vignette — warm golden */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      background: radial-gradient(ellipse at 50% 50%, transparent 35%, rgba(8, 7, 0, .88) 100%);
    }

    /* ═══════════ CANDLE ═══════════ */
    #candle-wrap {
      position: fixed;
      bottom: 0;
      right: 8%;
      z-index: 5;
      opacity: 0;
      transition: opacity 1.5s ease 1s;
    }

    #candle-wrap.show {
      opacity: 1
    }

    .candle {
      width: 22px;
      height: 80px;
      background: linear-gradient(180deg, #f5e6d0, #e8d0b0, #d4b896);
      border-radius: 3px 3px 0 0;
      position: relative;
      margin: auto;
    }

    .candle::after {
      content: '';
      position: absolute;
      width: 2px;
      height: 14px;
      background: #555;
      top: -13px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 1px;
    }

    .flame-wrap {
      position: absolute;
      top: -45px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .flame-outer {
      width: 18px;
      height: 36px;
      background: linear-gradient(180deg, #ff9800, #ff5722, #e53935);
      border-radius: 50% 50% 30% 30%;
      animation: flameWiggle 1.2s ease-in-out infinite;
      filter: blur(1px);
    }

    .flame-inner {
      width: 10px;
      height: 22px;
      background: linear-gradient(180deg, #fff8e1, #ffeb3b, #ff9800);
      border-radius: 50% 50% 30% 30%;
      position: absolute;
      top: 8px;
      filter: blur(.5px);
    }

    .flame-glow {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, rgba(255, 160, 50, .3), transparent 70%);
      border-radius: 50%;
      animation: glowPulse 1.2s ease-in-out infinite;
    }

    @keyframes flameWiggle {

      0%,
      100% {
        transform: skewX(-3deg) scaleX(.95)
      }

      33% {
        transform: skewX(3deg) scaleX(1.05)
      }

      66% {
        transform: skewX(-2deg) scaleX(.98)
      }
    }

    @keyframes glowPulse {

      0%,
      100% {
        opacity: .6;
        transform: translateX(-50%) scale(1)
      }

      50% {
        opacity: 1;
        transform: translateX(-50%) scale(1.15)
      }
    }

    .candle-base {
      width: 32px;
      height: 12px;
      background: #c4a882;
      border-radius: 50%;
      margin: auto
    }

    .drip {
      position: absolute;
      width: 5px;
      height: 12px;
      background: #e8d0b0;
      border-radius: 0 0 3px 3px;
      top: 10px
    }

    .drip.d1 {
      left: 4px;
      height: 9px
    }

    .drip.d2 {
      right: 6px;
      height: 15px
    }

    /* ═══════════ LETTER ═══════════ */
    #letter-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    #letter-wrap.show {
      opacity: 1;
      pointer-events: auto
    }

    .letter-paper {
      width: min(88vw, 520px);
      background: linear-gradient(160deg, #fffdf0, #fff9dc, #fef3b0);
      border-radius: 2px;
      padding: 38px 40px 42px;
      position: relative;
      box-shadow:
        0 0 0 1px rgba(200, 170, 60, .25),
        0 4px 25px rgba(0, 0, 0, .5),
        0 20px 60px rgba(0, 0, 0, .4),
        inset 0 0 30px rgba(255, 210, 80, .08);
      transform: rotate(-1deg);
      animation: paperFloat 5s ease-in-out infinite;
    }

    @keyframes paperFloat {

      0%,
      100% {
        transform: rotate(-1deg) translateY(0)
      }

      50% {
        transform: rotate(.5deg) translateY(-6px)
      }
    }

    /* paper texture lines — golden ruled */
    .letter-paper::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(200, 170, 60, .15) 27px, rgba(200, 170, 60, .15) 28px);
      border-radius: 2px;
      pointer-events: none;
    }

    /* golden margin line */
    .letter-paper::after {
      content: '';
      position: absolute;
      left: 52px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(210, 170, 30, .35);
    }

    .letter-date {
      font-size: .78rem;
      color: #8a7020;
      letter-spacing: .15rem;
      margin-bottom: 18px;
      text-align: right;
      font-style: italic;
    }

    .letter-greeting {
      font-family: 'Great Vibes', cursive;
      font-size: 2.2rem;
      color: #7a5c00;
      margin-bottom: 16px;
      text-shadow: 0 1px 3px rgba(180, 140, 0, .18);
    }

    #letter-body {
      font-size: clamp(.9rem, 2vw, 1.02rem);
      line-height: 1.95;
      color: #4a3a00;
      min-height: 120px;
      position: relative;
      z-index: 1;
    }

    .cursor-blink {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: #9a7a00;
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: cursorBlink .7s step-end infinite;
    }

    @keyframes cursorBlink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0
      }
    }

    .letter-sig {
      font-family: 'Great Vibes', cursive;
      font-size: 1.8rem;
      color: #7a5c00;
      margin-top: 20px;
      text-align: right;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .letter-sig.show {
      opacity: 1
    }

    /* flower stamp */
    .rose-stamp {
      position: absolute;
      bottom: 14px;
      right: 16px;
      font-size: 1.8rem;
      opacity: .18;
      transform: rotate(15deg);
    }

    /* ═══════════ PETALS — YELLOW ═══════════ */
    .petal-fall {
      position: fixed;
      pointer-events: none;
      width: var(--w);
      height: var(--h);
      background: var(--col);
      border-radius: 60% 10% 60% 10%;
      opacity: 0;
      z-index: 7;
      animation: petalFall var(--dur) linear var(--del) infinite;
    }

    @keyframes petalFall {
      0% {
        opacity: 0;
        transform: translateY(-20px) rotate(0deg) translateX(0)
      }

      8% {
        opacity: .7
      }

      88% {
        opacity: .45
      }

      100% {
        opacity: 0;
        transform: translateY(105vh) rotate(600deg) translateX(var(--dx))
      }
    }

    /* ═══════════ PROGRESS BAR ═══════════ */
    #progress-wrap {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 8;
      text-align: center;
      opacity: 0;
      transition: opacity .5s;
    }

    #progress-wrap.show {
      opacity: 1
    }

    #progress-bar {
      width: 120px;
      height: 2px;
      background: rgba(255, 255, 255, .1);
      border-radius: 2px;
      margin: 0 auto 8px;
      overflow: hidden;
    }

    #progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #8b3a3a, #c8a09a);
      width: 0%;
      transition: width .1s linear
    }

    #progress-label {
      color: rgba(200, 150, 130, .5);
      font-size: .7rem;
      letter-spacing: .2rem
    }
  </style>
</head>

<body>

  <!-- ═══ OPENING ═══ -->
  <div id="opening">
    <p class="op-label">Dành riêng cho em</p>
    <div class="op-rose-icon">🌼</div>
    <h1 class="op-title">Gửi Người Anh Thương</h1>
    <button id="openBtn">Chạm để mở ✦</button>
  </div>

  <!-- ═══ SCENE ═══ -->
  <div id="scene">
    <canvas id="bgCvs"></canvas>
    <canvas id="roseCvs"></canvas>
    <canvas id="particleCvs"></canvas>
    <div class="vignette"></div>

    <!-- Candle -->
    <div id="candle-wrap">
      <div class="flame-glow"></div>
      <div class="flame-wrap">
        <div class="flame-outer">
          <div class="flame-inner"></div>
        </div>
      </div>
      <div class="candle">
        <div class="drip d1"></div>
        <div class="drip d2"></div>
      </div>
      <div class="candle-base"></div>
    </div>

    <!-- Letter -->
    <div id="letter-wrap">
      <div class="letter-paper">
        <p class="letter-date">20 tháng 10, 2026 &nbsp;—&nbsp; Đêm...</p>
        <p class="letter-greeting">Em yêu ơi,</p>
        <div id="letter-body"><span class="cursor-blink"></span></div>
        <p class="letter-sig" id="sig">— người iu em —</p>
        <span class="rose-stamp">🌼</span>
      </div>
    </div>

    <!-- Progress -->
    <div id="progress-wrap">
      <div id="progress-bar">
        <div id="progress-fill"></div>
      </div>
      <p id="progress-label">Hoa đang nở...</p>
    </div>
  </div>

  <script>
    // ═══ STARS ═══
    (function () {
      const o = document.getElementById('opening');
      for (let i = 0; i < 60; i++) {
        const s = document.createElement('div');
        const sz = Math.random() * 1.8 + .4;
        s.style.cssText = `position:absolute;border-radius:50%;background:rgba(255,220,80,.8);
      width:${sz}px;height:${sz}px;left:${Math.random() * 100}%;top:${Math.random() * 100}%;
      animation:twinkle ${(Math.random() * 2.5 + 1).toFixed(1)}s ease-in-out ${(Math.random() * 3).toFixed(1)}s infinite`;
        o.appendChild(s);
      }
      const style = document.createElement('style');
      style.textContent = '@keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.9}}';
      document.head.appendChild(style);
    })();

    // ═══ OPEN ═══
    document.getElementById('openBtn').addEventListener('click', () => {
      const op = document.getElementById('opening');
      op.style.transition = 'opacity .9s'; op.style.opacity = '0';
      setTimeout(() => {
        op.style.display = 'none';
        document.getElementById('scene').style.display = 'block';
        initScene();
      }, 900);
    });

    // ═══ INIT ═══
    function initScene() {
      bgSetup();
      spawnPetals();
      roseBloom(() => {
        document.getElementById('candle-wrap').classList.add('show');
        document.getElementById('letter-wrap').classList.add('show');
        setTimeout(startTypewriter, 1200);
      });
    }

    // ═══ BG — golden starfield ═══
    function bgSetup() {
      const c = document.getElementById('bgCvs'), ctx = c.getContext('2d');
      let W, H, stars = [];
      function rs() { W = c.width = innerWidth; H = c.height = innerHeight }
      rs(); window.addEventListener('resize', rs);
      for (let i = 0; i < 180; i++) stars.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + .2, ph: Math.random() * Math.PI * 2, sp: Math.random() * .01 + .003 });
      let t = 0;
      (function draw() {
        t += .007;
        // deep amber-black bg
        const bg = ctx.createRadialGradient(W * .5, H * .65, 0, W * .5, H * .5, Math.max(W, H));
        bg.addColorStop(0, '#1a1500'); bg.addColorStop(.55, '#0e0b00'); bg.addColorStop(1, '#060500');
        ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
        // warm golden candle glow bottom right
        const cg = ctx.createRadialGradient(W * .85, H, 0, W * .85, H, W * .32);
        cg.addColorStop(0, 'rgba(255,180,40,.12)'); cg.addColorStop(1, 'transparent');
        ctx.fillStyle = cg; ctx.fillRect(0, 0, W, H);
        // subtle golden haze center-bottom
        const mg = ctx.createRadialGradient(W * .5, H * .85, 0, W * .5, H * .85, W * .4);
        mg.addColorStop(0, `rgba(255,200,50,${.03 + Math.sin(t * .4) * .015})`);
        mg.addColorStop(1, 'transparent');
        ctx.fillStyle = mg; ctx.fillRect(0, 0, W, H);
        // gold stars
        stars.forEach(s => {
          const a = (Math.sin(t * s.sp * 50 + s.ph) + 1) * .5 * .75;
          ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,230,130,${a})`; ctx.fill();
        });
        requestAnimationFrame(draw);
      })();
    }

    // ═══ ROSE BLOOM (canvas animation) ═══
    function roseBloom(onDone) {
      const c = document.getElementById('roseCvs'), ctx = c.getContext('2d');
      let W, H;
      function rs() { W = c.width = innerWidth; H = c.height = innerHeight }
      rs(); window.addEventListener('resize', rs);

      document.getElementById('progress-wrap').classList.add('show');

      let progress = 0; // 0→1
      const dur = 3800; // ms for full bloom
      let start = null;

      function drawRose(cx, cy, sz, p) {
        // p = 0..1 bloom progress
        if (p <= 0) return;
        ctx.save();

        // --- STEM ---
        const stemH = sz * 2.8 * Math.min(p * 2, 1);
        ctx.beginPath();
        ctx.moveTo(cx, cy + sz * .3);
        ctx.bezierCurveTo(cx - sz * .3, cy + sz * .3 - stemH * .4, cx + sz * .2, cy + sz * .3 - stemH * .7, cx, cy + sz * .3 - stemH);
        ctx.lineWidth = sz * .12 * Math.min(p * 3, 1); ctx.strokeStyle = '#2d5a27'; ctx.lineCap = 'round'; ctx.stroke();

        // --- LEAVES ---
        if (p > .3) {
          const lp = Math.min((p - .3) / .4, 1);
          const lx = cx - sz * .15, ly = cy + sz * .3 - stemH * .45;
          ctx.save(); ctx.translate(lx, ly); ctx.scale(lp, lp);
          ctx.beginPath(); ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-sz * .4, -sz * .3, -sz * .7, sz * .1, -sz * .4, sz * .3);
          ctx.bezierCurveTo(-sz * .2, sz * .2, 0, sz * .1, 0, 0);
          ctx.fillStyle = '#3a7a32'; ctx.fill(); ctx.restore();

          ctx.save(); ctx.translate(cx + sz * .1, ly - sz * .2); ctx.scale(lp * .8, lp * .8);
          ctx.beginPath(); ctx.moveTo(0, 0);
          ctx.bezierCurveTo(sz * .35, -sz * .25, sz * .6, sz * .15, sz * .35, sz * .28);
          ctx.bezierCurveTo(sz * .2, sz * .18, 0, sz * .08, 0, 0);
          ctx.fillStyle = '#4a8a3a'; ctx.fill(); ctx.restore();
        }

        // --- BUD / PETALS ---
        const roseY = cy + sz * .3 - stemH;
        const roseP = Math.max(p - .15, 0) / .85; // petals start at p=0.15

        // SEPALS (green base)
        if (roseP > 0) {
          const sp = Math.min(roseP * 2, 1);
          for (let i = 0; i < 5; i++) {
            const a = (i / 5) * Math.PI * 2;
            ctx.save(); ctx.translate(roseY !== undefined ? cx : cx, roseY);
            // fix: use roseY
            ctx.translate(cx - cx, 0); // noop
            ctx.restore();
            // just draw sepal
            ctx.save(); ctx.translate(cx, roseY); ctx.rotate(a);
            ctx.beginPath(); ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-sz * .08 * sp, -sz * .25 * sp, -sz * .04 * sp, -sz * .42 * sp, 0, -sz * .45 * sp);
            ctx.bezierCurveTo(sz * .04 * sp, -sz * .42 * sp, sz * .08 * sp, -sz * .25 * sp, 0, 0);
            ctx.fillStyle = '#2d6b25'; ctx.fill(); ctx.restore();
          }
        }

        // OUTER PETALS — yellow rose
        const numOuter = 12;
        const outerR = sz * .58 * roseP;
        const outerOpen = Math.min(roseP / .6, 1); // how open
        for (let i = 0; i < numOuter && roseP > 0; i++) {
          const a = (i / numOuter) * Math.PI * 2;
          const pr = outerR * (roseP > .05 ? 1 : roseP / .05);
          ctx.save();
          ctx.translate(cx + Math.cos(a) * pr * .65, roseY + Math.sin(a) * pr * .65);
          ctx.rotate(a + Math.PI * .5);
          const pSz = sz * (0.26 + outerOpen * .04);
          ctx.beginPath(); ctx.ellipse(0, 0, pSz * .6, pSz, 0, 0, Math.PI * 2);
          const pg = ctx.createRadialGradient(0, -pSz * .25, 0, 0, 0, pSz);
          pg.addColorStop(0, `rgba(255,245,160,${.88 * roseP})`);
          pg.addColorStop(.5, `rgba(255,210,50,${.9 * roseP})`);
          pg.addColorStop(1, `rgba(200,150,10,${.92 * roseP})`);
          ctx.fillStyle = pg; ctx.fill(); ctx.restore();
        }

        // INNER PETALS — deeper gold
        const numInner = 8, innerP = Math.max(roseP - .2, 0) / .8;
        const innerR = sz * .34 * innerP;
        for (let i = 0; i < numInner && innerP > 0; i++) {
          const a = (i / numInner) * Math.PI * 2 + .35;
          ctx.save();
          ctx.translate(cx + Math.cos(a) * innerR * .65, roseY + Math.sin(a) * innerR * .65);
          ctx.rotate(a + Math.PI * .5);
          const pSz = sz * .22;
          ctx.beginPath(); ctx.ellipse(0, 0, pSz * .55, pSz, 0, 0, Math.PI * 2);
          const ig = ctx.createRadialGradient(0, -pSz * .2, 0, 0, 0, pSz);
          ig.addColorStop(0, `rgba(255,252,200,${.92 * innerP})`);
          ig.addColorStop(1, `rgba(230,175,20,${.94 * innerP})`);
          ctx.fillStyle = ig; ctx.fill(); ctx.restore();
        }

        // CORE — warm amber
        const coreP = Math.max(roseP - .4, 0) / .6;
        if (coreP > 0) {
          const cg = ctx.createRadialGradient(cx, roseY, 0, cx, roseY, sz * .18 * coreP);
          cg.addColorStop(0, `rgba(255,255,220,${coreP})`);
          cg.addColorStop(.6, `rgba(255,200,50,${coreP})`);
          cg.addColorStop(1, `rgba(180,130,0,${coreP})`);
          ctx.beginPath(); ctx.arc(cx, roseY, sz * .18 * coreP, 0, Math.PI * 2);
          ctx.fillStyle = cg; ctx.fill();
        }

        // GLOW — golden halo
        if (roseP > .5) {
          const gp = (roseP - .5) / .5;
          const gl = ctx.createRadialGradient(cx, roseY, 0, cx, roseY, sz * 1.3);
          gl.addColorStop(0, `rgba(255,220,50,${.15 * gp})`);
          gl.addColorStop(.5, `rgba(255,180,20,${.08 * gp})`);
          gl.addColorStop(1, 'transparent');
          ctx.beginPath(); ctx.arc(cx, roseY, sz * 1.3, 0, Math.PI * 2); ctx.fillStyle = gl; ctx.fill();
        }

        ctx.restore();
      }

      function frame(ts) {
        if (!start) start = ts;
        const elapsed = ts - start;
        progress = Math.min(elapsed / dur, 1);

        ctx.clearRect(0, 0, W, H);

        const rSz = Math.min(W, H) * .2;
        const rX = W * .5, rY = H * .78;

        drawRose(rX, rY, rSz, progress);

        // update progress bar
        document.getElementById('progress-fill').style.width = (progress * 100) + '%';
        if (progress >= 1) {
          document.getElementById('progress-label').textContent = 'Hoa đã nở ✦';
          setTimeout(() => {
            document.getElementById('progress-wrap').style.opacity = '0';
          }, 1500);
          onDone();
        } else {
          requestAnimationFrame(frame);
        }
      }
      requestAnimationFrame(frame);

      // after bloom, keep drawing (static rose + glow animate)
      // handled inside the done callback if needed
    }

    // ═══ TYPEWRITER ═══
    const letter = `Hôm nay 20/10, anh chỉ muốn nhắn vài lời mộc mạc mà anh hay nghĩ trong đầu thôi.
Anh thừa nhận mình chẳng khéo nói, cũng không biết chọn hoa sao cho đẹp... nhưng anh luôn cố gắng chăm sóc em bằng những việc thực tế nhất. 
Em lúc nào cũng xứng đáng được yêu thương và chiều chuộng. Với anh, em luôn là điều đặc biệt nhất.
Chúc em 20/10, à thật ra là ngày nào cũng nên có thật nhiều niềm vui và bình yên. Dù có chuyện gì xảy ra, cứ yên tâm là lúc nào anh cũng ở ngay bên cạnh em.`;

    function startTypewriter() {
      const el = document.getElementById('letter-body');
      el.innerHTML = '<span class="cursor-blink"></span>';
      const cursor = el.querySelector('.cursor-blink');
      let i = 0;
      const speed = 38; // ms per char
      function type() {
        if (i < letter.length) {
          const ch = letter[i];
          const txt = document.createTextNode(ch === '\n' ? ' ' : ch);
          if (ch === '\n') {
            el.insertBefore(document.createElement('br'), cursor);
            el.insertBefore(document.createElement('br'), cursor);
          } else {
            el.insertBefore(txt, cursor);
          }
          i++;
          setTimeout(type, speed + (ch === '.' || ch === '!' || ch === '?' ? 350 : ch === ',' ? 120 : 0));
        } else {
          cursor.remove();
          document.getElementById('sig').classList.add('show');
        }
      }
      type();
    }

    // ═══ PETALS — golden yellow ═══
    function spawnPetals() {
      const cols = [
        'rgba(255,220,50,.72)', 'rgba(255,200,30,.68)',
        'rgba(255,240,130,.65)', 'rgba(230,170,10,.62)',
        'rgba(255,255,180,.60)', 'rgba(200,150,0,.55)'
      ];
      for (let i = 0; i < 22; i++) {
        const p = document.createElement('div'); p.className = 'petal-fall';
        const w = Math.random() * 14 + 5, h = w * .7;
        p.style.cssText = `--w:${w}px;--h:${h}px;--col:${cols[Math.floor(Math.random() * cols.length)]};
      --dur:${(Math.random() * 10 + 8).toFixed(1)}s;--del:${(Math.random() * 15).toFixed(1)}s;
      --dx:${(Math.random() - .5) * 180}px;left:${Math.random() * 100}%;top:-20px;`;
        document.getElementById('scene').appendChild(p);
      }
    }

    // ═══ PARTICLE (golden fireflies) ═══
    (function fireflies() {
      const c = document.getElementById('particleCvs'), ctx = c.getContext('2d');
      let W, H;
      function rs() { W = c.width = innerWidth; H = c.height = innerHeight }
      rs(); window.addEventListener('resize', rs);
      const flies = Array.from({ length: 45 }, () => ({
        x: Math.random() * 1, y: Math.random() * 1,
        vx: (Math.random() - .5) * .0008, vy: (Math.random() - .5) * .0008,
        r: Math.random() * 2.8 + .6, ph: Math.random() * Math.PI * 2, sp: Math.random() * .025 + .008
      }));
      let t = 0;
      (function draw() {
        t += .016; ctx.clearRect(0, 0, W, H);
        flies.forEach(f => {
          f.x += f.vx; f.y += f.vy;
          if (f.x < 0) f.x = 1; if (f.x > 1) f.x = 0;
          if (f.y < 0) f.y = 1; if (f.y > 1) f.y = 0;
          const a = (Math.sin(t * f.sp * 40 + f.ph) + 1) * .5;
          // golden glow
          const grd = ctx.createRadialGradient(f.x * W, f.y * H, 0, f.x * W, f.y * H, f.r * 5);
          grd.addColorStop(0, `rgba(255,230,80,${a * .85})`);
          grd.addColorStop(.4, `rgba(255,200,30,${a * .4})`);
          grd.addColorStop(1, 'transparent');
          ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(f.x * W, f.y * H, f.r * 5, 0, Math.PI * 2); ctx.fill();
          // bright core
          ctx.beginPath(); ctx.arc(f.x * W, f.y * H, f.r * .6, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,220,${a})`; ctx.fill();
        });
        requestAnimationFrame(draw);
      })();
    })();
  </script>
